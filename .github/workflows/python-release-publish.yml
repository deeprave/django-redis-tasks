name: Build and Publish Python Package

on:
  workflow_dispatch:

jobs:
  release-commit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.release-commit.outputs.sha }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Find validated release commit
        id: release-commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          read -r conclusion run_sha < <(
            gh run list \
              --workflow python-test-and-build.yml \
              --branch main \
              --commit "$sha" \
              --limit 1 \
              --json conclusion,headSha \
              --jq '.[0] | "\(.conclusion // "") \(.headSha // "")"'
          )
          if [[ "$conclusion" != "success" || "$run_sha" != "$sha" ]]; then
            echo "No successful Test and Build CI run exists for $sha." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: release-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-commit.outputs.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: latest

      - name: Build package
        shell: bash
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/

  publish:
    needs: [release-commit, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-commit.outputs.sha }}

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: distributions
          path: dist/

      - name: Read release version
        id: release
        shell: bash
        run: |
          version=$(python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          head=$(git rev-parse HEAD)
          if existing=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            if [[ "$existing" != "$head" ]]; then
              echo "Release tag $TAG already points to a different commit." >&2
              exit 1
            fi
            echo "Release tag $TAG already points to this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          python - "$VERSION" > release-notes.md <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text().splitlines()
          heading = re.compile(rf"^## (?:v)?{re.escape(version)}(?:\s|$)")
          start = next((index + 1 for index, line in enumerate(lines) if heading.match(line)), None)
          if start is None:
              print(f"Warning: CHANGELOG.md has no entry for v{version}", file=sys.stderr)
              raise SystemExit(0)
          notes = []
          for line in lines[start:]:
              if line.startswith("## "):
                  break
              notes.append(line)
          text = "\n".join(notes).strip()
          if not text:
              print(f"Warning: CHANGELOG.md entry for v{version} has no release notes", file=sys.stderr)
              raise SystemExit(0)
          print(text)
          PY
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
